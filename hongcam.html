<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DTRE Vương Thị Hồng Cẩm</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            cursor: pointer;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="main-canvas"></canvas>

    <script>
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d');

        let width, height, particles = [], fallingItems = [];
        let messageIndex = -1;
        let state = 'start-forming';
        let holdTimer;
        let hasStarted = false;
        let particleTemplates = [];
        let introTemplate = [];
        let maxParticles = 0;

        // =========================================================
        // === LỜI CHÚC CỦA BẠN ===
        // =========================================================
        const messages = [
            ["Happy birthday", "ebeiuuuu<3"],
            ["Chúc em tuổi mới", "hạnh phúc đong đầy"],
            ["Cả đời luôn bình an"],
            ["Mong mọi thứ", "sẽ dịu dàng với em"],
            ["Nụ cười vui", "luôn trên môi em"],
            ["Happy birthday, Ebe quễ hưn", "Vương Thị Hồng Cẩm ❤️"]
        ];
        // =========================================================

        // === CÁC TÙY CHỈNH ===
        const displayTime = 1750;
        const transitionTime = 1000;
        // *** THAY ĐỔI 1: Tăng số lượng mưa rơi gấp đôi ***
        const numberOfFallingItems = 100; // Đã thay đổi từ 50
        const mainRedColor = "#FF4081";
        const glowColor = "#E01E5A";
        const specialWords = ["Vương Thị Hồng Cẩm", "Cẩm", "❤️"];

        // === THAY ĐỔI: Vẽ bánh sinh nhật ===
        // Đã thay thế hàm drawHeart bằng hàm drawCake
        function drawCake(x, y, size) {
            const candleHeight = size * 0.3;
            const candleWidth = size * 0.05;
            const flameSize = size * 0.08;
            const tier1Height = size * 0.35;
            const tier1Width = size * 0.8;
            const tier2Height = size * 0.4;
            const tier2Width = size * 1.2; // Rộng hơn tầng 1
            const cornerRadius = size * 0.05;

            // Tầng 1 (trên)
            ctx.fillStyle = mainRedColor;
            ctx.beginPath();
            ctx.roundRect(x - tier1Width / 2, y, tier1Width, tier1Height, cornerRadius);
            ctx.fill();

            // Tầng 2 (dưới)
            ctx.beginPath();
            ctx.roundRect(x - tier2Width / 2, y + tier1Height, tier2Width, tier2Height, cornerRadius);
            ctx.fill();
            
            // Nến (Trắng)
            ctx.fillStyle = '#FFFFFF';
            const candleY = y - candleHeight;
            // Nến giữa
            ctx.fillRect(x - candleWidth / 2, candleY, candleWidth, candleHeight);
            // Nến trái
            ctx.fillRect(x - tier1Width / 4 - candleWidth / 2, candleY, candleWidth, candleHeight);
            // Nến phải
            ctx.fillRect(x + tier1Width / 4 - candleWidth / 2, candleY, candleWidth, candleHeight);

            // Ngọn lửa (Vàng)
            ctx.fillStyle = '#FFD700'; // Vàng gold
            const flameY = candleY - flameSize / 2;
            // Lửa giữa
            ctx.beginPath();
            ctx.arc(x, flameY, flameSize, 0, Math.PI * 2);
            ctx.fill();
            // Lửa trái
            ctx.beginPath();
            ctx.arc(x - tier1Width / 4, flameY, flameSize, 0, Math.PI * 2);
            ctx.fill();
            // Lửa phải
            ctx.beginPath();
            ctx.arc(x + tier1Width / 4, flameY, flameSize, 0, Math.PI * 2);
            ctx.fill();
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.originX = this.x;
                this.originY = this.y;
                this.targetX = this.x;
                this.targetY = this.y;
                this.size = 2;
                this.color = mainRedColor;
                this.isActive = false;
            }
            draw() {
                if (!this.isActive) return;
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                // === THAY ĐỔI: Tối ưu hóa (mượt hơn) ===
                ctx.shadowBlur = 5; // Giảm từ 10
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
            update() {
                const dx = this.targetX - this.x;
                const dy = this.targetY - this.y;
                const ease = 0.08;
                if (Math.abs(dx) < 0.1 && Math.abs(dy) < 0.1) {
                    this.x = this.targetX; this.y = this.targetY;
                } else {
                    this.x += dx * ease; this.y += dy * ease;
                }
            }
        }

        class FallingObject {
             constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * -height;
                // === THAY ĐỔI: Tăng tốc độ rơi 1.25x ===
                this.speed = (Math.random() * 3 + 2) * 1.25;
                this.size = Math.random() * 10 + 8;
                const fallingChars = ['❤️', '🎂', 'cẩm🥳', '💕', '❤️', 'CẨM💕'];
                this.char = fallingChars[Math.floor(Math.random() * fallingChars.length)];
            }
            update() {
                this.y += this.speed;
                if (this.y > height + this.size) {
                    this.y = -this.size; this.x = Math.random() * width;
                }
            }
            draw() {
                ctx.font = `${this.size}px Arial`;
                // *** THAY ĐỔI 3: Làm cho các chữ rơi rõ nét, không mờ ***
                ctx.fillStyle = this.char === '❤️' ? mainRedColor : 'rgba(255, 255, 255, 1)'; // Đã thay đổi từ 0.8
                ctx.fillText(this.char, this.x, this.y);
            }
        }

        function setParticleTargets(template) {
            if (!template) return;
            for(let i = 0; i < maxParticles; i++) {
                if (i < template.length) {
                    particles[i].targetX = template[i].x;
                    particles[i].targetY = template[i].y;
                    particles[i].color = template[i].color;
                    particles[i].isActive = true;
                } else {
                    particles[i].isActive = false;
                    particles[i].targetX = particles[i].originX;
                    particles[i].targetY = particles[i].originY;
                }
            }
        }

        function nextMessage() {
            if (state === 'final-hold') return;
            messageIndex++;
            if (messageIndex >= messages.length) {
                state = 'final-hold';
                return;
            }
            state = 'disperse';
            setTimeout(() => {
                state = 'gather';
                setParticleTargets(particleTemplates[messageIndex]);
            }, transitionTime);
        }

        function changeState() {
            if (state === 'gather' || state === 'start-forming') {
                if (particles.every(p => !p.isActive || (Math.abs(p.targetX - p.x) < 0.5 && Math.abs(p.targetY - p.y) < 0.5))) {
                    state = (state === 'gather') ? 'hold' : 'start-hold';
                    if (state === 'hold') {
                        clearTimeout(holdTimer);
                        holdTimer = setTimeout(nextMessage, displayTime);
                    }
                }
            }
        }
        
        function drawVisibleContent() {
            if (state === 'disperse') return;
            let shouldDraw = false;
            let alpha = 0;

            if (state === 'hold' || state === 'start-hold' || state === 'final-hold') {
                 alpha = 1; shouldDraw = true;
            } else if (state === 'gather' || state === 'start-forming') {
                let maxDist = 0;
                particles.forEach(p => {
                    if(p.isActive) maxDist = Math.max(maxDist, Math.sqrt(Math.pow(p.targetX - p.x, 2) + Math.pow(p.targetY - p.y, 2)));
                });
                if (maxDist < 100) { alpha = 1 - (maxDist / 100); shouldDraw = true; }
            }
            
            if (shouldDraw) {
                ctx.globalAlpha = alpha;
                // === THAY ĐỔI: Tối ưu hóa (mượt hơn) ===
                ctx.shadowColor = glowColor; ctx.shadowBlur = 8; // Giảm từ 15
                if (messageIndex === -1) {
                    drawIntroScreen();
                } else {
                    drawMessageScreen();
                }
                ctx.globalAlpha = 1;
            }
            ctx.shadowBlur = 0;
        }
        
        // === THAY ĐỔI: Chỉnh sửa để vẽ bánh ===
        function drawIntroScreen() {
            const cakeSize = Math.min(width/5, 120);
            const fontSize = Math.min(width/20, 25);
            
            // Tính toán chiều cao của nến và lửa để căn giữa
            const candleAndFlameHeight = cakeSize * 0.3 + cakeSize * 0.08;
            const cakeBodyHeight = cakeSize * 0.35 + cakeSize * 0.4;
            
            const totalVisualHeight = candleAndFlameHeight + cakeBodyHeight + fontSize * 2.5;
            let startY = height/2 - totalVisualHeight/2;
            
            ctx.fillStyle = mainRedColor;
            ctx.shadowColor = glowColor;
            
            // Y-coordinate cho phần thân bánh (không phải nến)
            let cakeTopY = startY + candleAndFlameHeight;
            drawCake(width/2, cakeTopY, cakeSize);
            
            // Căn chỉnh chữ bên dưới bánh
            startY = cakeTopY + cakeBodyHeight + fontSize * 1.5;
            ctx.font = `bold ${fontSize}px "Arial", sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText("20.10.2006", width/2, startY);
            startY += fontSize * 1.2;
            ctx.fillText("Vương Thị Hồng Cẩm", width/2, startY);
        }
        
        function drawMessageScreen() {
            const lines = messages[messageIndex];
            if (!lines) return;
            
            const isLastMessage = messageIndex === messages.length - 1;
            const fontSize = isLastMessage ? Math.min(width / 13, 55) : Math.min(width / 12, 60);

            ctx.font = `bold ${fontSize}px "Arial", sans-serif`;
            ctx.textAlign = 'center';
            const totalHeight = lines.length * (fontSize * 1.2);
            let startY = height / 2 - totalHeight / 2 + fontSize / 2;

            if (isLastMessage) {
                ctx.fillStyle = mainRedColor;
                for (const line of lines) {
                    ctx.fillText(line, width / 2, startY);
                    startY += fontSize * 1.2;
                }
            } else {
                for (const line of lines) {
                    const parts = line.split(new RegExp(`(${specialWords.join('|')})`, 'g')).filter(Boolean);
                    let currentX = width / 2 - ctx.measureText(line).width / 2;
                    parts.forEach(part => {
                        ctx.fillStyle = specialWords.includes(part) ? mainRedColor : '#fff';
                        ctx.fillText(part, currentX + ctx.measureText(part).width / 2, startY);
                        currentX += ctx.measureText(part).width;
                    });
                    startY += fontSize * 1.2;
                }
            }
        }

        function animate() {
            // *** THAY ĐỔI 2: Xóa hiệu ứng mờ (motion blur) ***
            ctx.fillStyle = 'rgba(0, 0, 0, 1)'; // Đã thay đổi từ 0.25
            ctx.fillRect(0, 0, width, height);
            if (hasStarted) fallingItems.forEach(item => { item.update(); item.draw(); });
            
            particles.forEach(p => {
                if(state === 'disperse') {
                    if(Math.random() < 0.3) {
                       p.targetX = p.originX; p.targetY = p.originY;
                    }
                }
                if (state !== 'final-hold') p.update();
                p.draw();
            });
            ctx.shadowBlur = 0;
            
            drawVisibleContent();
            if (state !== 'final-hold') changeState();
            
            requestAnimationFrame(animate);
        }

        function setup() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            
            // === THAY ĐỔI: Tối ưu hóa (mượt hơn) ===
            // Giảm mật độ hạt bằng cách tăng bước nhảy (step)
            const densityStep = 3; // Tăng từ 2 lên 3

            ctx.clearRect(0,0,width,height);
            drawIntroScreen();
            introTemplate = [];
            let imageData = ctx.getImageData(0, 0, width, height).data;
            for (let y = 0; y < height; y += densityStep) {
                for (let x = 0; x < width; x += densityStep) {
                    if (imageData[(y * width + x) * 4 + 3] > 128) {
                        introTemplate.push({x, y, color: mainRedColor});
                    }
                }
            }
            maxParticles = introTemplate.length;

            particleTemplates = [];
            for(let i = 0; i < messages.length; i++) {
                ctx.clearRect(0,0,width,height);
                drawMessageScreenWithColorLogic(messages[i], i);
                let msgTemplate = [];
                imageData = ctx.getImageData(0, 0, width, height).data;
                for (let y = 0; y < height; y += densityStep) {
                    for (let x = 0; x < width; x += densityStep) {
                        const imgDataIndex = (y * width + x) * 4;
                        if (imageData[imgDataIndex + 3] > 128) {
                             if (i === messages.length - 1) {
                                 msgTemplate.push({x, y, color: mainRedColor});
                             } else {
                                 const isRed = imageData[imgDataIndex] > 150 && imageData[imgDataIndex+1] < 100 && imageData[imgDataIndex+2] < 100;
                                 msgTemplate.push({x, y, color: isRed ? mainRedColor : '#fff'});
                             }
                        }
                    }
                }
                particleTemplates.push(msgTemplate);
                maxParticles = Math.max(maxParticles, msgTemplate.length);
            }
            
            particles = [];
            for(let i = 0; i < maxParticles; i++) particles.push(new Particle());

            setParticleTargets(introTemplate);
            if (!animate.isAnimating) {
                animate();
                animate.isAnimating = true;
            }
        }

        function drawMessageScreenWithColorLogic(lines, index) {
            const isLastMessage = index === messages.length - 1;
            const fontSize = isLastMessage ? Math.min(width / 13, 55) : Math.min(width / 12, 60);

            ctx.font = `bold ${fontSize}px "Arial", sans-serif`;
            ctx.textAlign = 'center';
            const totalHeight = lines.length * (fontSize * 1.2);
            let startY = height / 2 - totalHeight / 2 + fontSize / 2;

            if (isLastMessage) {
                ctx.fillStyle = mainRedColor;
                for (const line of lines) {
                    ctx.fillText(line, width / 2, startY);
                    startY += fontSize * 1.2;
                }
            } else {
                for (const line of lines) {
                    const parts = line.split(new RegExp(`(${specialWords.join('|')})`, 'g')).filter(Boolean);
                    let currentX = width / 2 - ctx.measureText(line).width / 2;
                    parts.forEach(part => {
                        ctx.fillStyle = specialWords.includes(part) ? mainRedColor : '#fff';
                        ctx.fillText(part, currentX + ctx.measureText(part).width / 2, startY);
                        currentX += ctx.measureText(part).width;
                    });
                    startY += fontSize * 1.2;
                }
            }
        }

        // === THAY ĐỔI: Thêm kiểm tra mật khẩu ===
        canvas.addEventListener('click', () => {
            if (state === 'start-hold' && !hasStarted) {
                const password = prompt("❤️ Vui lòng nhập mật khẩu (DDMMYYYY) ❤️");
                if (password === "20102006") {
                    hasStarted = true;
                    for (let i = 0; i < numberOfFallingItems; i++) fallingItems.push(new FallingObject());
                    nextMessage();
                } else if (password !== null && password !== "") {
                    alert("Mật khẩu không đúng. Thử lại nha!");
                }
            }
        });
        
        window.addEventListener('resize', setup);
        setup();
    </script>
</body>
</html>
